[build]
  publish = "public"
  command = "npm run embed"

[functions]
  node_bundler = "nft"
  # The drawing library is loaded only when a card is built, and only if it works here.
  included_files = ["node_modules/@napi-rs/canvas/**", "node_modules/@napi-rs/canvas-linux-x64-gnu/**"]

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
